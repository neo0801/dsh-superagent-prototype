# Example profile configuration ($DSH_HOME/profiles/<profile>/cordis.patch.yml).
# Replace <placeholders> before first start; see docs/006-deployment.md.
- id: webserver
  config:
    host: 127.0.0.1
    port: 3082
- id: dsh-superagent
  config:
    stateDir: <absolute path, for example /home/me/.dsh/state/superagent>
    # Bench devices are optional: uncomment to lease them to workers, then give adb its absolute path and each device's
    # serial, projects, actions and capabilities. See docs/006-deployment.md; a change needs a restart.
    # bench:
    #   adb: /opt/android/platform-tools/adb
    #   adbServerSocket: tcp:127.0.0.1:5037
    #   leaseSeconds: 1800
    #   devices:
    #     - id: bench-a
    #       serial: <device serial, for example R58M123456A>
    #       projects: [<group/project>]
    #       capabilities: [android-13]
    #       actions: [shell, install, push, pull, logcat, exec-out]
    #       maintainer: <who to ask>
# Feishu is optional: uncomment to enable its Source, then set the bot's lark-cli on the Feishu Source.
# - id: dsh-superagent-feishu
#   disabled: false
